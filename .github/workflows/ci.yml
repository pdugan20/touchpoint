name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Build, Lint & Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install SwiftLint
        run: scripts/install-ci-tools.sh

      - name: Lint
        run: .build/ci-tools/bin/swiftlint lint --strict --quiet

      - name: Build
        run: |
          xcodebuild -project TouchPoint.xcodeproj \
            -scheme TouchPoint \
            -configuration Debug \
            -derivedDataPath "$HOME/DerivedData/touchpoint-slot-0" \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Test
        run: |
          xcodebuild test -project TouchPoint.xcodeproj \
            -scheme TouchPoint \
            -destination 'platform=macOS' \
            -derivedDataPath "$HOME/DerivedData/touchpoint-slot-0" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
